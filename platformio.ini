[platformio]
default_envs = esp32-2432s028

[env:esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++17
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.5.7
  paulstoffregen/XPT2046_Touchscreen @ ^1.4
